backend:
  name: git-gateway
  branch: main # 如果你的主分支叫 master，请改成 master

media_folder: "public/images/uploads" # 图片上传后存放的位置
public_folder: "/images/uploads" # 网站访问图片的路径

collections:
  - name: "events"
    label: "演出活动"
    folder: "data/events" # 数据存放文件夹
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime" }
      - { label: "地点", name: "location", widget: "string" }
      - { label: "封面图", name: "image", widget: "image" }
      - { label: "详情内容", name: "body", widget: "markdown" }

  - name: "members"
    label: "乐团成员"
    folder: "data/members"
    create: true
    fields:
      - { label: "姓名", name: "name", widget: "string" }
      - { label: "声部/职位", name: "role", widget: "string" }
      - { label: "头像", name: "avatar", widget: "image" }
      - { label: "简介", name: "bio", widget: "text" }
